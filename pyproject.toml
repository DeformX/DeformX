[project]
name = "cosseratx"
version = "0.1.0"
description = "Wire simulation, Isaac Sim rendering, dataset generation, and RL utilities for CosseratX."
requires-python = ">=3.10,<3.13"
dependencies = [
    "hydra-core>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "omegaconf>=2.3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = [
    "torch>=2.2",
    "wandb>=0.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
